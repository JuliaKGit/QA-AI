name: E2E Tests

on:
  push:

jobs:
  playwright:
    name: Playwright
    timeout-minutes: 60
    runs-on: ubuntu-latest
    environment: dev1
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Didaxis Playwright tests
        run: npx playwright test ds
        env:
          CI: true
          DIDAXIS_URL: ${{ secrets.DIDAXIS_URL }}
          DIDAXIS_EMAIL: ${{ secrets.DIDAXIS_EMAIL }}
          DIDAXIS_PASSWORD: ${{ secrets.DIDAXIS_PASSWORD }}
          DIDAXIS_API_TOKEN: ${{ secrets.DIDAXIS_API_TOKEN }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
